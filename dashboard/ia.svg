<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="title">IA, datos y seguridad</title><desc id="desc">Machine learning, Vexum e IA generativa, bases de datos vectoriales con Pinecone y contribuciones de privacidad en DELIA.</desc>
<defs>
  <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#140b26"/><stop offset=".52" stop-color="#24143d"/><stop offset="1" stop-color="#10091d"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#a758ed" stop-opacity=".38"/><stop offset="1" stop-color="#a758ed" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x2=".3" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#eacaff" stop-opacity=".18"/><stop offset=".37" stop-color="#9975ca" stop-opacity=".095"/><stop offset="1" stop-color="#130b26" stop-opacity=".56"/></linearGradient>
  <linearGradient id="edge" x2=".85" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#efd9ff" stop-opacity=".65"/><stop offset=".45" stop-color="#c3a0fc" stop-opacity=".24"/><stop offset="1" stop-color="#ad72ed" stop-opacity=".34"/></linearGradient>
  <linearGradient id="shine"><stop stop-color="#e5ceff" stop-opacity="0"/><stop offset=".32" stop-color="#f8e7ff" stop-opacity=".8"/><stop offset="1" stop-color="#e5ceff" stop-opacity="0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#f0bfff"/><stop offset="1" stop-color="#a088ff"/></linearGradient>
  <linearGradient id="metal" x2=".35" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#ffedff"/><stop offset=".22" stop-color="#d7a0ff"/><stop offset=".47" stop-color="#6242af" stop-opacity=".12"/><stop offset=".72" stop-color="#9c61f6" stop-opacity=".46"/><stop offset="1" stop-color="#f9d7ff"/></linearGradient>
  <radialGradient id="orb" cx=".37" cy=".26" r=".71"><stop stop-color="#eedaff" stop-opacity=".71"/><stop offset=".35" stop-color="#a758ed" stop-opacity=".34"/><stop offset=".69" stop-color="#38236e" stop-opacity=".11"/><stop offset="1" stop-color="#e4b3ff" stop-opacity=".5"/></radialGradient>
  <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#e0c8ff" opacity=".14"/></pattern>
  <clipPath id="frame"><rect width="1000" height="440" rx="31"/></clipPath>
</defs>
<style>
  .counter-static {display:none}
  .counter-roll { animation: count-up 8s infinite; }
  .graph-reveal { animation: reveal 8s cubic-bezier(.25,.6,.35,1) infinite; }
  .graph-scan { animation: scan 8s ease-in-out infinite; }
  .cell-beat { animation: cell-beat 5.5s ease-in-out infinite; }
  .metric-fill { transform-origin:0 0; animation: fill-meter 8s cubic-bezier(.25,.6,.35,1) infinite; }
  @keyframes count-up {
    0% { transform:translateY(0); animation-timing-function:steps(var(--frames),end); }
    35%,100% { transform:translateY(var(--end)); }
  }
  @keyframes reveal {0% {transform:scaleX(.001)} 42%,100% {transform:scaleX(1)}}
  @keyframes scan {0% {transform:translateX(-161px);opacity:0} 8% {opacity:1} 86%,100% {transform:translateX(902px);opacity:0}}
  @keyframes cell-beat {0%,46%,100% {opacity:.58} 20% {opacity:1}}
  @keyframes fill-meter {0% {transform:scaleX(.01)} 39%,100% {transform:scaleX(1)}}
  @media (prefers-reduced-motion: reduce) {
    .counter-roll,.graph-reveal,.graph-scan,.cell-beat,.metric-fill {animation:none}
    .counter-motion,.graph-scan {display:none}
    .counter-static {display:inline}
  }
</style>
<g clip-path="url(#frame)">
<rect width="1000" height="440" fill="url(#background)"/>
<ellipse cx="880" cy="15" rx="480" ry="255" fill="url(#aura)"/>
<ellipse cx="230" cy="440" rx="470" ry="169" fill="url(#aura)" opacity=".56"/>
<rect width="1000" height="440" fill="url(#dots)"/>
<rect x="1" y="1" width="998" height="438" rx="30" fill="none" stroke="url(#edge)"/>
<text x="43" y="55" font-size="15" font-weight="700" fill="#d6baff" letter-spacing="2.2">INTELIGENCIA ARTIFICIAL</text><text x="43" y="108" font-size="48" font-weight="750" fill="#fff6ff" >IA, datos y seguridad</text><text x="45" y="149" font-size="22" font-weight="400" fill="#e6ddf8" >Modelado, automatización y protección de datos en aplicaciones de IA.</text><rect x="43" y="186" width="294" height="223" rx="25" fill="url(#glass)" stroke="url(#edge)"/><path d="M68 187h244" stroke="url(#shine)"/><text x="63" y="231" font-size="25" font-weight="725" fill="#fff6ff" >Machine Learning</text><text x="63" y="259" font-size="17" font-weight="650" fill="#e9baff" >Modelado y evaluación</text><text x="63" y="297" font-size="18" font-weight="400" fill="#e6ddf8" >Regresión y segmentación</text><text x="63" y="322" font-size="18" font-weight="400" fill="#e6ddf8" >K-Means, PCA y ensambles</text><text x="63" y="347" font-size="18" font-weight="400" fill="#e6ddf8" >Ajuste de hiperparámetros</text><text x="63" y="372" font-size="18" font-weight="400" fill="#e6ddf8" >Validación cruzada agrupada</text><rect x="353" y="186" width="294" height="223" rx="25" fill="url(#glass)" stroke="url(#edge)"/><path d="M378 187h244" stroke="url(#shine)"/><text x="373" y="231" font-size="25" font-weight="725" fill="#fff6ff" >IA generativa</text><text x="373" y="259" font-size="17" font-weight="650" fill="#e9baff" >Software y automatización</text><text x="373" y="297" font-size="18" font-weight="400" fill="#e6ddf8" >Vexum · iniciativa de software</text><text x="373" y="322" font-size="18" font-weight="400" fill="#e6ddf8" >Automatización e IA</text><text x="373" y="347" font-size="18" font-weight="400" fill="#e6ddf8" >Formación en IA generativa</text><text x="373" y="372" font-size="18" font-weight="400" fill="#e6ddf8" >Pinecone · bases vectoriales</text><rect x="663" y="186" width="294" height="223" rx="25" fill="url(#glass)" stroke="url(#edge)"/><path d="M688 187h244" stroke="url(#shine)"/><text x="683" y="231" font-size="25" font-weight="725" fill="#fff6ff" >Seguridad en IA</text><text x="683" y="259" font-size="17" font-weight="650" fill="#e9baff" >Gobernanza y privacidad</text><text x="683" y="297" font-size="18" font-weight="400" fill="#e6ddf8" >DELIA · contribución integrada</text><text x="683" y="322" font-size="18" font-weight="400" fill="#e6ddf8" >Detección y enmascaramiento</text><text x="683" y="347" font-size="18" font-weight="400" fill="#e6ddf8" >de identificadores personales</text><text x="683" y="372" font-size="18" font-weight="400" fill="#e6ddf8" >Pruebas y benchmarks</text>
</g></svg>