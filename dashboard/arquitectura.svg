<title id="title">Arquitectura de sistemas</title><desc id="desc">Flujo vertical de aplicación cliente, API, servicios de backend y capa de datos. Cinco capas conectadas de experiencia, API, servicios, datos e infraestructura. React, Next.js y Kotlin en cliente. REST y Firebase Authentication para integración. Node.js, Python, Spring Boot y FastAPI en servicios. PostgreSQL, Supabase, MongoDB, Firestore y Pinecone en datos. Azure, Docker, Git y GitHub Actions en infraestructura.</desc>
