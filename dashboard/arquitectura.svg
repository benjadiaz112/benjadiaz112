<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 614" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="title">Arquitectura de sistemas</title><desc id="desc">Diagrama de cliente, APIs REST, servicios y datos. Incluye tecnologías de entrega, infraestructura, autenticación y persistencia.</desc>
<defs>
  <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#140b26"/><stop offset=".52" stop-color="#24143d"/><stop offset="1" stop-color="#10091d"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#a758ed" stop-opacity=".38"/><stop offset="1" stop-color="#a758ed" stop-opacity="0"/></radialGradient>
