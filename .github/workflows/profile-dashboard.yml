name: Actualizar métricas del perfil

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: main
      - name: Actualizar y renderizar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 profile/update.py --include-private
          if git diff --quiet -- profile/stats.json; then
            exit 0
          fi
          python3 profile/render.py --stats profile/stats.json --output . --publish-activity
      - name: Publicar cuando cambien los datos
        run: |
          git add -A -- README.md profile/stats.json dashboard/actividad.svg 'dashboard/actividad-*.svg'
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Actualizar métricas del perfil'
          git push origin HEAD:main
